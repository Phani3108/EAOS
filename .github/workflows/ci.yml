name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'hardening/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eaos
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: eaos_m0_fixture
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U eaos" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Production compose configuration
        # Renders deploy/docker-compose.production.yml with the real Compose CLI, which
        # catches schema errors the contract test (services/gateway/src/
        # production-compose.test.ts) cannot. The untouched template must be refused:
        # the stack has no default passwords.
        shell: bash
        run: |
          if docker compose --env-file deploy/.env.example -f deploy/docker-compose.production.yml config --quiet 2>/dev/null; then
            echo '::error title=Production compose::the blank deploy/.env.example renders, so the stack would start without its secrets'
            exit 1
          fi
          env_file="$(mktemp)"
          secret="$(openssl rand -hex 32)"
          sed -E "s/^(POSTGRES_PASSWORD|EAOS_APP_DB_PASSWORD|REDIS_PASSWORD|JWT_SECRET|GRAFANA_PASSWORD)=\$/\1=${secret}/" deploy/.env.example > "$env_file"
          docker compose --env-file "$env_file" -f deploy/docker-compose.production.yml config --quiet
          echo 'Production compose renders once every required secret is set'

      - name: Build
        run: pnpm build

      - name: Unit & integration tests
        run: pnpm test
        env:
          # Never call external APIs in CI — the gateway falls back to
          # simulation when these are unset, which is exactly what we want.
          NODE_ENV: test

      - name: M0 PostgreSQL acceptance
        run: pnpm test:m0
        env:
          EAOS_TEST_DATABASE_URL: postgresql://eaos:fixture-only-password@127.0.0.1:5432/eaos_m0_fixture

      - name: M2 durable runtime acceptance
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U eaos eaos_m2_fixture
          pnpm test:m2
        env:
          EAOS_TEST_DATABASE_URL: postgresql://eaos:fixture-only-password@127.0.0.1:5432/eaos_m2_fixture

      - name: Browser authentication acceptance
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser

      - name: Gateway smoke test
        # Boots the compiled gateway as the production image does (NODE_ENV=production,
        # signed tokens, a throwaway signing key, file store in a scratch directory) and
        # fails unless /api/ready answers 200 within the deadline and SIGTERM stops it
        # cleanly. `shell: bash` runs this with -eo pipefail. The default shell is
        # `bash -e` without pipefail, which is how the old `curl ... | tee` stayed green
        # with no gateway running. services/gateway/src/ci-smoke-step.test.ts runs this
        # script against a gateway that crashes, one that never becomes ready, one that
        # does not stop cleanly and a healthy one.
        shell: bash
        env:
          NODE_ENV: production
          PORT: '3000'
          GATEWAY_READY_TIMEOUT_SECONDS: '60'
        run: |
          JWT_SECRET="$(openssl rand -hex 32)"
          DATA_DIR="$(mktemp -d)"
          export JWT_SECRET DATA_DIR
          log="$(mktemp)"
          pnpm --filter @agentos/gateway start > "$log" 2>&1 &
          gateway_pid=$!
          fail() {
            echo "::error title=Gateway smoke test::$1"
            echo '--- gateway output ---'
            cat "$log"
            kill "$gateway_pid" 2>/dev/null || true
            exit 1
          }
          ready=false
          for ((elapsed = 0; elapsed < GATEWAY_READY_TIMEOUT_SECONDS; elapsed++)); do
            kill -0 "$gateway_pid" 2>/dev/null || fail 'the gateway exited before it became ready'
            if curl -fs --max-time 2 -o /dev/null "http://127.0.0.1:${PORT}/api/ready"; then ready=true; break; fi
            sleep 1
          done
          [ "$ready" = true ] || fail "/api/ready did not answer 200 within ${GATEWAY_READY_TIMEOUT_SECONDS}s"
          echo "Gateway ready after ${elapsed}s"
          curl -fsS --max-time 5 "http://127.0.0.1:${PORT}/api/health" || fail '/api/health did not answer 200 after readiness'
          echo
          kill -TERM "$gateway_pid"
          for ((waited = 0; waited < 20; waited++)); do
            kill -0 "$gateway_pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$gateway_pid" 2>/dev/null; then fail 'the gateway was still running 20s after SIGTERM'; fi
          wait "$gateway_pid" || fail 'the gateway did not shut down cleanly after SIGTERM'
        continue-on-error: false
