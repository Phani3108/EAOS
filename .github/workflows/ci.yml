name: CI

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'hardening/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: eaos
          POSTGRES_PASSWORD: fixture-only-password
          POSTGRES_DB: eaos_m0_fixture
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U eaos" --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck
        continue-on-error: false

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Build
        run: pnpm build

      - name: Unit & integration tests
        run: pnpm test
        env:
          # Never call external APIs in CI — the gateway falls back to
          # simulation when these are unset, which is exactly what we want.
          NODE_ENV: test

      - name: M0 PostgreSQL acceptance
        run: pnpm test:m0
        env:
          EAOS_TEST_DATABASE_URL: postgresql://eaos:fixture-only-password@127.0.0.1:5432/eaos_m0_fixture

      - name: M2 durable runtime acceptance
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb -U eaos eaos_m2_fixture
          pnpm test:m2
        env:
          EAOS_TEST_DATABASE_URL: postgresql://eaos:fixture-only-password@127.0.0.1:5432/eaos_m2_fixture

      - name: Browser authentication acceptance
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:browser

      - name: Gateway smoke test
        run: |
          pnpm --filter @agentos/gateway start &
          GATEWAY_PID=$!
          # Wait up to 30 s for the health endpoint
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "Gateway healthy after ${i}s"; break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/health | tee /tmp/health.json
          kill $GATEWAY_PID || true
        continue-on-error: false
