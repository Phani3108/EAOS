<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow readout</title>
<style>
  :root {
    --ink: #1f2a37; --muted: #5b6878; --line: #c9d1da; --page: #ffffff; --lane: #f4f6f8;
    --band: #3b4652; --phase: #4f7a8a; --badge: #3f6f80;
    --actor: #dfe9ee; --actor-b: #8aa7b4;
    --svc: #ffffff; --svc-b: #2b3540;
    --llm: #fbefc7; --llm-b: #d4b25a;
    --emb: #fbf3db; --emb-b: #d9c38a;
    --api: #cfe1e8; --api-b: #6e98a8;
    --plat: #e3e6e9; --plat-b: #8d969f;
    --opt: #eef0f2; --opt-b: #9aa3ab;
    --gap-b: #c0392b;
    --guard: #e3f2e6; --guard-b: #5e9e6e;
    --eval: #ece6f6; --eval-b: #8a76b8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 13px/1.45 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
  .wrap { padding: 28px 32px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 14px; max-width: 1100px; }
  .meta { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0 0 22px; font-size: 12.5px; }
  .meta dt { font-weight: 600; } .meta dd { margin: 0; color: var(--muted); }

  /* ── Diagram ─────────────────────────────────────────────── */
  #diagram { display: inline-block; padding: 18px; background: var(--page); }
  .grid { display: grid; gap: 6px; }
  .uc { background: var(--band); color: #fff; font-weight: 700; font-size: 12px; padding: 7px 10px; border-radius: 3px; }
  .ph { background: var(--phase); color: #fff; font-weight: 600; font-size: 11.5px; padding: 6px 10px; border-radius: 2px; }
  .lanehead { background: var(--lane); padding: 12px 10px; border-left: 4px solid var(--phase); }
  .lanehead b { display: block; font-size: 12.5px; }
  .lanehead span { display: block; color: var(--muted); font-size: 10.5px; margin-top: 3px; }
  .cell { background: var(--lane); padding: 8px 7px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #dfe4e9; }
  .gapcol { background: repeating-linear-gradient(135deg, #f1f3f5 0 6px, #e6e9ec 6px 12px); border: 1px dashed #b9c1c9; display: flex; align-items: center; justify-content: center; }
  .gapcol span { writing-mode: vertical-rl; transform: rotate(180deg); color: var(--muted); font-size: 11px; font-weight: 600; text-align: center; padding: 8px 0; }
  .box { position: relative; border: 1.4px solid; border-radius: 4px; padding: 7px 8px 8px; font-size: 10.6px; line-height: 1.38; }
  .box .tag { font-size: 9px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }
  .box .t { font-weight: 700; font-size: 11.4px; margin-bottom: 3px; padding-right: 20px; }
  .box .b { color: #33404d; overflow-wrap: anywhere; }
  .box code { font-size: 10px; background: rgba(255,255,255,.55); padding: 0 2px; border-radius: 2px; }
  .badge { position: absolute; top: 6px; right: 6px; width: 18px; height: 18px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .k-actor { background: var(--actor); border-color: var(--actor-b); }
  .k-service { background: var(--svc); border-color: var(--svc-b); }
  .k-llm { background: var(--llm); border-color: var(--llm-b); }
  .k-embedding { background: var(--emb); border-color: var(--emb-b); border-style: dashed; }
  .k-api { background: var(--api); border-color: var(--api-b); }
  .k-platform { background: var(--plat); border-color: var(--plat-b); }
  .k-optional { background: var(--opt); border-color: var(--opt-b); border-style: dashed; }
  .k-notintegrated { background: #fff; border-color: var(--gap-b); border-style: dashed; }
  .k-notintegrated .tag { color: var(--gap-b); }
  .k-guardrail { background: var(--guard); border-color: var(--guard-b); }
  .k-eval { background: var(--eval); border-color: var(--eval-b); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 14px; font-size: 11px; color: var(--muted); }
  .legend i { display: inline-block; width: 22px; height: 13px; border: 1.4px solid; border-radius: 3px; vertical-align: -2px; margin-right: 6px; }
  .legend .n { width: 16px; height: 16px; border-radius: 50%; background: var(--badge); border: 0; }
  .foot { display: flex; justify-content: space-between; gap: 20px; margin-top: 8px; font-size: 10.5px; color: var(--muted); }

  /* ── Readout text ─────────────────────────────────────────── */
  .text { max-width: 1180px; margin-top: 34px; }
  .text h2 { font-size: 17px; margin: 30px 0 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .text h3 { font-size: 13.5px; margin: 18px 0 6px; color: var(--phase); }
  .text p.intro { color: var(--muted); margin: 0 0 10px; }
  ol.steps { list-style: none; padding: 0; margin: 0; }
  ol.steps li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin: 0 0 7px; }
  ol.steps li .num { width: 20px; height: 20px; border-radius: 50%; background: var(--badge); color: #fff; font-size: 10.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 6px 0 4px; }
  th, td { text-align: left; vertical-align: top; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { background: var(--lane); font-weight: 600; }
  td code, li code { font-size: 11.5px; background: #f2f4f6; padding: 0 3px; border-radius: 3px; }
  ul.bul { margin: 4px 0 0 18px; padding: 0; } ul.bul li { margin: 0 0 4px; }
  body.diagram-only .text, body.diagram-only .head { display: none; }
  body.diagram-only .wrap { padding: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><h1 id="title"></h1><p class="sub" id="subtitle"></p><dl class="meta" id="meta"></dl></div>
  <div id="diagram"></div>
  <div class="text" id="text"></div>
</div>

<script id="workflow-data" type="application/json">{"title":"EAOS — end-to-end workflow","subtitle":"How a request becomes an agent run, an approved action and an audited outcome. The diagram shows every LLM call, platform API call, integration, data store, guardrail and eval the flow depends on.","meta":[{"k":"Scope","v":"UC1 Delegate a skill run · UC2 Coordinate multi-agent work · UC3 Govern and operate"},{"k":"Source of truth","v":"EAOS repository, branch `hardening/movement-1`, commit `66bc561`: source code, migrations 007–026, `packages/config` env spec, `.env.example`, compose files, CI workflow"},{"k":"Planned items","v":"From `docs/roadmap.md` (experience slices U1–U5, backend gaps G1–G16). Labelled as planned"},{"k":"Date","v":"29 October 2026"}],"useCases":[{"id":"UC1","title":"Delegate a skill run","phases":["p1","p2","p3","p4","p5","p6"]},{"id":"UC2","title":"Coordinate multi-agent work","phases":["p7","p8"]},{"id":"UC3","title":"Govern and operate","phases":["p9","p10"]}],"phases":[{"id":"p1","title":"1 Open and sign in"},{"id":"p2","title":"2 Ask for work"},{"id":"p3","title":"3 Decide mode and admit"},{"id":"p4","title":"4 Agents do the work","width":268},{"id":"p5","title":"5 Approve"},{"id":"p6","title":"6 Deliver and record"},{"id":"gap","gap":true,"text":"Outside EAOS: the approved work lands in GitHub · Jira · Slack"},{"id":"p7","title":"7 Plan a goal"},{"id":"p8","title":"8 Swarm and pipeline"},{"id":"p9","title":"9 Connect and automate"},{"id":"p10","title":"10 Budget, evaluate, promote","width":260}],"lanes":[{"id":"ui","title":"People and web app","subtitle":"What the user sees and does · Next.js 15"},{"id":"svc","title":"EAOS gateway","subtitle":"Node · TypeScript · deterministic code · durable workers"},{"id":"ai","title":"AI models","subtitle":"Anthropic · OpenAI · Azure OpenAI · Gemini · Ollama"},{"id":"api","title":"Integration APIs","subtitle":"GitHub · Jira · Slack · identity provider · MCP"},{"id":"data","title":"Data and platform services","subtitle":"PostgreSQL runtime · Vault · Redis · telemetry"},{"id":"guard","title":"Guardrails and evals","subtitle":"What protects and what measures each phase"}],"boxes":[{"phase":"p1","lane":"ui","kind":"actor","badge":1,"tag":"User · Web app","title":"User opens EAOS","body":"The landing page is public. The session gate checks `GET /api/auth/me`, then offers **Try the demo** (public mode), an API key, SSO or first-time setup"},{"phase":"p1","lane":"svc","kind":"service","badge":2,"tag":"Gateway","title":"Authenticate every request","body":"Strip `/_/gateway` → CORS allowlist → public paths → cookie session (Origin checked) or API key / JWT → demo principal → membership → rate limit → role and persona guards"},{"phase":"p1","lane":"api","kind":"api","badge":3,"tag":"Identity provider","title":"OIDC single sign-on","body":"`.well-known/openid-configuration` · token endpoint · JWKS, with PKCE, nonce and cookie binding. Via `/api/auth/oidc/authorize|callback|exchange`"},{"phase":"p1","lane":"data","kind":"platform","tag":"PostgreSQL","title":"Sessions and tenants","body":"`browser_auth_sessions` (refresh rotation, reuse detection) · `tenants` · `platform_memberships`"},{"phase":"p1","lane":"guard","kind":"guardrail","title":"Access control","body":"Roles user < operator < admin · persona scopes · public demo visitors isolated · local demo only from this machine · rate limits per minute · tenant row-level security"},{"phase":"p2","lane":"ui","kind":"actor","badge":4,"tag":"User · Web app","title":"Pick a skill and fill the form","body":"From a regiment's hub (Marketing, Engineering, Product, HR, Talent, Program). Typed inputs · model list from `GET /api/llm/models` · files via `POST /api/artifacts` · Sandbox by default when no model is set"},{"phase":"p2","lane":"svc","kind":"service","badge":5,"tag":"Gateway","title":"Accept the run","body":"`POST /api/execute` · schema-validated body · persona access for every step · compiled catalogue of 81 definitions, or an adopted SKILL.md · optional `Idempotency-Key`"},{"phase":"p2","lane":"data","kind":"platform","tag":"PostgreSQL","title":"Input artifacts","body":"`input_artifacts`: text files only, digest-pinned to the run"},{"phase":"p2","lane":"guard","kind":"guardrail","title":"Input validation","body":"Each field validated by type · artifact allowlist (txt, md, csv, json, ≤512 KB) · filenames sanitised · a reused key with a different body is refused (409)"},{"phase":"p3","lane":"svc","kind":"service","badge":6,"tag":"Gateway","title":"Decide run mode and admit","body":"Demo visitors are always simulated · otherwise the user's choice · with no model configured, a labelled simulation · live runs need a priced model (otherwise 400) · steps snapshotted with each agent's call sign and rank"},{"phase":"p3","lane":"data","kind":"platform","badge":7,"tag":"PostgreSQL durable runtime","title":"Queue the run","body":"`runtime_definitions` · `runtime_runs` · `runtime_jobs` (queued). Without `DATABASE_URL`: in-process queue (file mode)"},{"phase":"p3","lane":"guard","kind":"guardrail","title":"Mode and spend","body":"Simulation decided by the server, never the browser · priced-model admission · live calls need a workspace budget (`limit_micros`) · at most 1,000 model invocations per step"},{"phase":"p4","lane":"svc","kind":"service","badge":8,"tag":"Durable worker","title":"Claim and run each step","body":"4 workers · claim with `FOR UPDATE SKIP LOCKED`, 30 s lease and fencing token · heartbeat every 5 s · capacity 2 per agent and 8 per tenant · step kinds: llm, tool, approval, condition, join, subworkflow, planner"},{"phase":"p4","lane":"ai","kind":"llm","badge":9,"tag":"LLM call","title":"One call per agent step","body":"`callLLMUnified` · the agent's system prompt (call sign, rank, regiment, quality gates) plus the PII-redacted task · default **Claude Sonnet 4.6** · fallback Anthropic → OpenAI → Azure → Gemini → Ollama · usage reserved, then settled or released"},{"phase":"p4","lane":"api","kind":"api","badge":10,"tag":"Connector tool steps","title":"GitHub · Jira · Slack","body":"`GET /repos/{r}/pulls/{n}` · `POST …/issues/{n}/comments` · `POST /rest/api/3/issue` · `chat.postMessage`. Each write is read back to confirm it · 30 s timeout · 6 typed actions"},{"phase":"p4","lane":"data","kind":"platform","badge":11,"tag":"Vault · PostgreSQL","title":"Secrets and knowledge","body":"Vault KV2 resolves each connection's secret reference per call · reviewed knowledge (Postgres full-text search, max 20) is passed as \"evidence, not instructions\""},{"phase":"p4","lane":"data","kind":"optional","tag":"Optional · env-gated","title":"MCP servers","body":"voicebox (HTTP) · code-memory and skillspector (stdio). Connected only when their env vars are set; tool calls are operator-only"},{"phase":"p4","lane":"guard","kind":"guardrail","title":"Safe execution","body":"PII redaction before the prompt · outbound guard (HTTPS, allowlisted hosts, private ranges blocked, no redirects) · uncertain effects marked inconclusive · model failures throw, never fabricated output"},{"phase":"p4","lane":"guard","kind":"eval","title":"Per-step quality","body":"Quality score 0–10 on live LLM steps · required output sections and citations enforced · a broken handoff contract marks the step inconclusive"},{"phase":"p5","lane":"svc","kind":"service","badge":12,"tag":"Durable runtime","title":"Pause at the gate","body":"`runtime_approvals` row with the draft's digest and an expiry (24 h by default) · job waiting · run paused. Simulated runs never pause"},{"phase":"p5","lane":"ui","kind":"actor","badge":13,"tag":"Approver","title":"Approver reviews the draft","body":"The run shows **Needs approval**. Approve/Reject is available in Pipeline view today; a full Approvals inbox is planned (U2)"},{"phase":"p5","lane":"svc","kind":"service","badge":14,"tag":"Gateway","title":"Decide safely","body":"`POST /api/executions/:id/approve|reject/:stepId` · operator or above (demo visitors on their own runs) · named approvers · digest must match · every confirmation ticked · reject cancels the whole run tree"},{"phase":"p5","lane":"guard","kind":"guardrail","title":"Human in the loop","body":"Confirmations · draft-digest match · expiry sweep · named approvers · no bulk approve"},{"phase":"p6","lane":"svc","kind":"service","badge":15,"tag":"Gateway · outbox","title":"Complete and publish events","body":"Outputs and artifacts (immutable) · `runtime_events` outbox → WebSocket broadcast (Redis fan-out when `REDIS_URL` is set) · trace at `GET /api/executions/:id/trace`"},{"phase":"p6","lane":"ui","kind":"actor","badge":16,"tag":"User · Web app","title":"User sees the outcome","body":"Timeline with agent call signs, Live or Simulated labels, outputs and cost. Polls `GET /api/executions/:id` every 2 s; live WebSocket updates in the UI are planned (U1)"},{"phase":"p6","lane":"data","kind":"platform","tag":"PostgreSQL · OTEL","title":"Audit and telemetry","body":"`platform_audit` · `integration_audit` · `runtime_events` · OpenTelemetry export when configured · SHA-256 hash-chained audit in file mode"},{"phase":"p6","lane":"guard","kind":"guardrail","title":"Accountability","body":"Every step names its agent · every decision names its human · secrets are never returned by any API"},{"phase":"p7","lane":"ui","kind":"actor","badge":17,"tag":"User · Web app","title":"Delegate a goal or chat","body":"A goal (`POST /api/orchestrator/goal`, operator today; opening it to requesters is planned, G4b) or a chat message (`/api/chat/sessions/:id/messages`)"},{"phase":"p7","lane":"svc","kind":"service","badge":18,"tag":"Gateway","title":"Compile and fan out","body":"Goal → planner step → task plan → child runs, from the authorized catalogue only · chat → `/skill {json}` command or a one-step run with a named agent"},{"phase":"p7","lane":"ai","kind":"llm","badge":19,"tag":"LLM call","title":"Goal planner","body":"Produces a JSON plan from authorized catalogue skills · a goal that would be simulated without a plan is refused"},{"phase":"p7","lane":"guard","kind":"guardrail","title":"Bounded planning","body":"The planner cannot invent skills · persona scopes checked on every child run · depth limit 5"},{"phase":"p8","lane":"svc","kind":"service","badge":20,"tag":"Gateway","title":"Swarm phases and pipeline DAG","body":"`POST /api/swarms/launch`: each phase is an approval gate plus a child run, and `/advance` decides the gate · `POST /api/pipeline/execute`: graph with quality gates and checkpoints (operator)"},{"phase":"p8","lane":"ai","kind":"llm","tag":"LLM call","title":"Per-step calls in child runs","body":"Same per-agent call as step 9, inside each child run"},{"phase":"p8","lane":"data","kind":"platform","tag":"PostgreSQL","title":"Run tree","body":"`runtime_children` · `runtime_agent_leases` · run-tree lock for retry and cancel"},{"phase":"p8","lane":"guard","kind":"eval","title":"Checkpoint quality gates","body":"Pipeline quality gates and phase approvals must pass before the next phase runs"},{"phase":"p9","lane":"ui","kind":"actor","badge":21,"tag":"Admin · Builder","title":"Connect tools and automate","body":"Admin connects GitHub, Jira or Slack with a Vault secret reference. A builder schedules recurring work"},{"phase":"p9","lane":"svc","kind":"service","badge":22,"tag":"Gateway","title":"Connections and schedules","body":"`POST /api/connections/{github|jira|slack}/connect` (secret reference under tenant/user) · `/test` probe · `POST /api/scheduler/jobs` (cron with timezone, interval, event) → dispatched by the worker"},{"phase":"p9","lane":"api","kind":"api","tag":"Connection probes","title":"Verify the connection","body":"GitHub `GET /user` · Jira `GET /rest/api/3/myself` · Slack `auth.test`"},{"phase":"p9","lane":"data","kind":"platform","tag":"Vault · PostgreSQL","title":"Connections and schedules","body":"Vault KV2 (tokens never stored in EAOS) · `workspace_connections` · `runtime_schedules` · `runtime_trigger_receipts`"},{"phase":"p9","lane":"guard","kind":"guardrail","title":"Secrets and authority","body":"Connection writes are admin-only · only references are stored · secrets never returned · failed schedules are parked with their reason"},{"phase":"p10","lane":"svc","kind":"service","badge":23,"tag":"Gateway · platform API","title":"Budgets, evaluations, registry","body":"`PUT /api/runtime/usage {limitMicros}` · evaluation datasets (1–100 labelled cases) · registry stage → review → activate · `POST /api/review/run` with 4 reviewer roles"},{"phase":"p10","lane":"ai","kind":"llm","badge":24,"tag":"LLM call","title":"Review pipeline","body":"Strategy, design, engineering and developer-experience reviewers in sequence, each seeing earlier verdicts (temperature 0.3, ≤1,500 tokens). No budget reservation yet"},{"phase":"p10","lane":"data","kind":"platform","tag":"PostgreSQL","title":"Platform records","body":"`runtime_usage_budgets` · `platform_datasets` · `platform_evaluations` · `platform_registry_packages` · `platform_audit`"},{"phase":"p10","lane":"guard","kind":"eval","title":"Release gate","body":"Promotion needs a live evaluation of at least 3 cases at a 100% pass rate, and a reviewer who is not the publisher"}],"footnote":"Each box sits in its phase's column. Badges match the walkthrough. Env-gated means off unless its env variable is set. In file mode (no DATABASE_URL) the gateway uses an in-process queue and approval bus.","source":"Source of truth: EAOS, hardening/movement-1 @ 66bc561 (29 Oct 2026)","steps":[{"group":"UC1 · Open and sign in","items":[{"n":1,"text":"The user opens EAOS. The landing page is public. The session gate calls `GET /api/auth/me`. Without a session it offers **Try the demo** (when `EAOS_DEMO_MODE=public`), sign-in with an API key, organisation SSO, or first-time administrator setup (`POST /api/setup` with `EAOS_SETUP_TOKEN`)."},{"n":2,"text":"Every request passes the gateway pipeline in order: strip the `/_/gateway` prefix → CORS allowlist → public-path check → cookie session (Origin checked on writes) or API key / JWT → demo principal → tenant membership (suspended → 403) → per-client rate limit → role and persona guards."},{"n":3,"text":"With SSO, the gateway runs OIDC with PKCE, nonce and cookie binding against the identity provider's discovery document, token endpoint and JWKS, then exchanges a one-time login code for a browser session."}]},{"group":"UC1 · Ask for work","items":[{"n":4,"text":"The user opens a regiment's hub (Marketing, Engineering, Product, HR, Talent or Program), picks a skill and fills a typed form. The model list comes from `GET /api/llm/models` (priced models only). Files upload through `POST /api/artifacts`. Run Mode defaults to Sandbox when no model is configured."},{"n":5,"text":"The web app calls `POST /api/execute`. The gateway validates the body, checks persona access for every step, and resolves the skill from the compiled catalogue (81 definitions), falling back to an adopted SKILL.md. An optional `Idempotency-Key` makes retries safe."}]},{"group":"UC1 · Decide mode and admit","items":[{"n":6,"text":"The runtime decides the run mode in one place. Public demo visitors are always simulated. Otherwise the user's choice wins, and with no choice and no LLM provider configured the run is a **labelled simulation**. Live runs must name a priced model (otherwise 400 with the allowed list). Each step is snapshotted with its agent's call sign, rank and approval rules."},{"n":7,"text":"On PostgreSQL the run is queued durably (`runtime_definitions`, `runtime_runs`, `runtime_jobs`). Without `DATABASE_URL` the gateway uses an in-process queue (file mode)."}]},{"group":"UC1 · Agents do the work","items":[{"n":8,"text":"One of four durable workers claims the job. The claim uses `FOR UPDATE SKIP LOCKED` with a 30 s lease and a fencing token, and the worker heartbeats every 5 s. Agent capacity is 2 concurrent steps per agent and 8 per tenant. Steps run in sequence or as a DAG: llm, tool, approval, condition, join, subworkflow and planner."},{"n":9,"text":"Each LLM step is one call through `callLLMUnified`. The prompt is the agent's system prompt (call sign, rank, regiment, quality gates and output sections) plus the task with PII redacted. The default model is Claude Sonnet 4.6; providers fall back in order Anthropic → OpenAI → Azure OpenAI → Gemini → Ollama. Usage is reserved before each call, then settled, or released when the call provably was not billed."},{"n":10,"text":"Tool steps call the connectors. GitHub covers reading a pull request, the compare view and commenting. Jira covers reading a project and creating an issue. Slack covers posting and reading messages. Every write is read back to confirm it happened, calls time out after 30 s, and outputs are schema-validated and capped at 128 KB."},{"n":11,"text":"Secrets come from Vault KV2 by reference at the moment of the call. Reviewed workspace knowledge (Postgres full-text search, at most 20 records) is attached as evidence, never as instructions. MCP servers (voicebox, code-memory, skillspector) join only when their env variables are set."}]},{"group":"UC1 · Approve","items":[{"n":12,"text":"A step that requires approval parks the run. A `runtime_approvals` row stores the digest of the exact draft and an expiry (24 h by default); the job waits and the run shows as paused. Simulated runs never pause."},{"n":13,"text":"The approver sees **Needs approval** with the draft. Approve and Reject buttons exist in Pipeline view today; a dedicated Approvals inbox is planned (roadmap U2, with a regiment-scoped approver role, G2)."},{"n":14,"text":"The decision calls `POST /api/executions/:id/approve|reject/:stepId`. It requires operator or above; public demo visitors may decide only their own runs. Named approvers are enforced, the draft digest must still match, and every required confirmation must be ticked. A rejection cancels the whole run tree, and expired gates are swept to rejected."}]},{"group":"UC1 · Deliver and record","items":[{"n":15,"text":"The run completes. Outputs and artifacts become immutable. Events go through the `runtime_events` outbox to a WebSocket broadcast (with Redis fan-out across instances when `REDIS_URL` is set). The full per-attempt trace is at `GET /api/executions/:id/trace`."},{"n":16,"text":"The user sees the timeline: agent call signs, Live or Simulated labels, outputs and cost. The UI polls every 2 s today; WebSocket updates in the UI are planned (U1). Audit goes to `platform_audit`, `integration_audit` and the event log, with OpenTelemetry when configured."}]},{"group":"Between the use cases","items":[{"n":"·","text":"Approved actions land in the team's own tools (GitHub, Jira, Slack). What happens there afterwards is outside EAOS."}]},{"group":"UC2 · Coordinate multi-agent work","items":[{"n":17,"text":"A user delegates a goal (`POST /api/orchestrator/goal`, operator-only today; planned for requesters, G4b) or sends a chat message to a session."},{"n":18,"text":"A goal becomes a planner step, then a task plan, then child runs drawn only from the authorized catalogue. A chat message becomes a `/skill {json}` command or a one-step run with a named agent; on PostgreSQL every message is a durable run."},{"n":19,"text":"The planner LLM call returns a JSON plan. A goal that would be simulated without a plan is refused, so simulation never pretends to plan."},{"n":20,"text":"Swarms (`POST /api/swarms/launch`) run phase by phase: each phase is an approval gate followed by a child run, and `/advance` decides the gate. Pipelines (`POST /api/pipeline/execute`) run a graph with quality gates and checkpoints. Child runs reuse the per-step LLM call from step 9, and the run tree is tracked in `runtime_children`."}]},{"group":"UC3 · Govern and operate","items":[{"n":21,"text":"An admin connects GitHub, Jira or Slack by giving a Vault secret reference; EAOS never stores the token. A builder schedules recurring work."},{"n":22,"text":"`POST /api/connections/{type}/connect` stores the reference under the user's tenant path, and `/test` probes the vendor (GitHub `/user`, Jira `/myself`, Slack `auth.test`). `POST /api/scheduler/jobs` creates cron (with timezone), interval or event schedules, which the durable worker dispatches."},{"n":23,"text":"Operators set the workspace budget (`PUT /api/runtime/usage`); live LLM calls are refused until one exists. They also record labelled evaluation datasets and move skill packages through the registry: stage, review by someone other than the publisher, then activate."},{"n":24,"text":"`POST /api/review/run` runs four reviewer roles in sequence (strategy, design, engineering, developer experience), each seeing the earlier verdicts. Results are approve, changes requested, inconclusive or simulated."}]}],"sections":[{"title":"Data and history calls","intro":"What the flow reads and writes, what lives only in memory, and what is not integrated.","bullets":["**Read and written on PostgreSQL:** runs, jobs, steps, attempts, approvals, events (outbox), artifacts and their lineage, usage budgets and reservations, schedules and trigger receipts, connections, chat sessions, workspace records (knowledge, configuration, memory decisions, notification and webhook rules), evaluation datasets, registry packages, audit.","**Run history:** every run, step attempt and approval decision is durable and queryable (`GET /api/executions`, `/trace`). There is no separate history or analytics store yet.","**Knowledge:** reviewed, unexpired records only, found by Postgres full-text search (max 20) and passed to the model as evidence.","**Held only in process memory, lost on restart:** the legacy memory graph, the model router's cost log and circuit state, `/api/query` sessions, legacy goal, swarm and pipeline results, and agent-eval fingerprints.","**Not produced on PostgreSQL yet:** agent KPIs, after-action reports, retraining flags and agent-memory extraction (file mode only; planned, G13).","**Not integrated:** no purchase, order or other business-history source is connected. The memory service's embeddings have no gateway caller. Email notifications are not implemented. Notification dispatch is recorded as unsupported on PostgreSQL."]},{"title":"LLM calls","intro":"Every call goes through the gateway's LLM wrapper. It throws on failure and never fabricates output. Default models: Anthropic Claude Sonnet 4.6, OpenAI gpt-4o, Azure OpenAI gpt-4o, Gemini gemini-1.5-pro, Ollama llama3.2. With no key configured, runs that don't choose a mode are simulated and labelled.","table":{"cols":["Call","Where","Model","When it runs","What it produces","Switch"],"rows":[["Agent step","`persona-api.ts` `executeSingleStepBody`","The model chosen on the run, or the provider default","Every live `llm` step","The step's output in the agent's required sections","On (live runs)"],["Goal planner","`persona-api.ts` planner step","Same","Live goal runs (durable)","JSON task plan from authorized catalogue skills","On"],["Handoff retry","`persona-api.ts` `retryHandoffBody`","Same","When required handoff fields are missing","One corrected attempt","On"],["Review pipeline","`review-pipeline.ts`","The chosen model, or the default","`POST /api/review/run`, not simulated","Reviewer verdict and findings (×4 roles)","On; no budget reservation yet"],["Chat reply (file mode)","`chat-engine.ts`","Default","File mode only; durable chat goes through runs","Agent reply","No `DATABASE_URL`"],["Ad-hoc query","`core.ts` `executeQuery`","Default","`/api/query`, file mode, not simulated","Answer","File mode"],["Legacy engines (vision, cognitive, swarm, pipeline, marketing)","`vision-api.ts`, `cognitive-pipeline.ts`, `swarm-manager.ts`, `pipeline-engine.ts`, `marketing-api.ts`","Default or chosen","Shadowed by the durable entry points, or quarantined on PostgreSQL","—","Legacy (removal planned, U5)"]]}},{"title":"Embedding models","table":{"cols":["Model","Used for","Status"],"rows":[["OpenAI `text-embedding-3-small` (1536 dims, pgvector `memory_vectors`)","Semantic memory in `services/memory`","Not wired: no gateway caller"],["Synthetic hash vectors","Local development only","`MEMORY_ALLOW_SYNTHETIC_EMBEDDINGS`, refused in production"],["— (Postgres full-text search)","Knowledge search in runs","Live; no vectors"]]}},{"title":"API calls and integrations","intro":"Connector calls resolve their secret from Vault at call time. All outbound connector HTTP goes through the outbound guard.","table":{"cols":["System","Call","Purpose","Auth"],"rows":[["GitHub","`GET /user` · `GET /repos/{r}` · `GET /repos/{r}/pulls/{n}` · `GET /compare/{base}...{head}` · `POST /repos/{r}/issues/{n}/comments`","Probe, read pull requests, comment (read back)","Token from Vault reference"],["Jira Cloud","`GET /rest/api/3/myself` · `GET /project/{k}` · `POST /issue` · `GET /issue/{k}`","Probe, read project, create issue (read back)","Email + API token from Vault"],["Slack","`auth.test` · `chat.postMessage` · `conversations.history`","Probe, post, read back","Bot token from Vault"],["Vault KV2","Read secret at path `<tenant>/<user>/…`","Resolve connection secrets","`VAULT_TOKEN` (HTTPS only)"],["Identity provider (OIDC)","Discovery · token endpoint · JWKS","Single sign-on","Client id/secret, PKCE"],["LLM providers","Anthropic Messages · OpenAI Chat · Azure OpenAI · Gemini generateContent · Ollama","All model calls","Provider API keys (env)"],["MCP servers","voicebox (HTTP) · code-memory, skillspector (stdio)","Voice, code memory, skill security scan","Env-gated; operator-only calls"],["Redis (optional)","Pub/sub","WebSocket fan-out across instances","`REDIS_URL`"],["OpenTelemetry (optional)","OTLP HTTP traces and metrics","Observability","`OTEL_EXPORTER_OTLP_ENDPOINT`"],["Slack / Teams webhooks (file mode)","Webhook POST","Completion notifications","`SLACK_WEBHOOK_URL`"]]}},{"title":"Guardrails","table":{"cols":["Guardrail","What it prevents","Where it is enforced","Default"],"rows":[["Roles and persona scopes","Users acting outside their role or function","`packages/auth/src/middleware.ts`, `server.ts` route guards, every step's persona","On"],["Demo isolation","Demo visitors seeing others' work or spending budget","`run-mode.ts`, `server.ts` `/api/auth/demo`, artifact quota (20 files / 2 MB, 24 h)","Demo off unless `EAOS_DEMO_MODE` set; local demo only from this machine"],["Server-decided run mode","Hidden live runs; failed keyless runs","`run-mode.ts` in `preparePersonaExecution` (every run)","On"],["Priced-model admission","Unbudgetable model calls","`admitModel` in `llm-provider.ts`","On for live runs"],["Budget reservations","Overspend","`reserveUsage` (`limit_micros`), released when not billed","Live calls refused until a budget exists"],["Human approval gates","Unapproved external actions; approving a changed draft","`runtime_approvals`: digest, expiry, confirmations, named approvers","Per skill step"],["PII redaction","Personal data reaching the model","`pii-redactor.ts`, applied to the step task prompt","On (agent steps; review and chat prompts not yet)"],["Prompt-injection hardening","Knowledge or task text acting as instructions","Knowledge labelled \"evidence, not instructions\"; planner limited to the catalogue","Partial; no classifier"],["Outbound guard (SSRF)","Calls to internal networks or unexpected hosts","`outbound-http.ts`: HTTPS, host allowlist, DNS pinned, private ranges blocked, no redirects","On for connectors and Vault"],["Policy check","Disallowed tool calls","`checkPolicy` in `mcp-executor.ts` (deny-first)","File-mode tool path"],["Skill security scan","Unsafe adopted skills","SkillSpector via MCP (risk ≥ 50 or high finding fails)","Only when configured; fails open by default"],["Origin / CSRF checks","Cross-site requests riding a session","Cookie writes, demo, refresh, OIDC exchange","On"],["Rate limits","Abuse and floods","`rate-limiter.ts`: unauthenticated 10, sign-in 60, user 120, operator 300, admin 500 per minute","On"],["Tenant isolation","Cross-tenant reads and writes","Row-level security on every runtime table; production refuses an owner/superuser DB role","On"],["Idempotency","Duplicate runs from retries","`request_key` + body hash; mismatch → 409","When the client sends a key"],["Artifact limits","Oversized or unsafe input files","Allowlist, ≤512 KB, sanitised names, immutable after commit","On"],["Secrets never returned","Credential leaks","Secret references only; HMAC-hashed API keys shown once; redacted configs","On"],["Honest failure","Fabricated success","LLM wrapper throws; uncertain effects become inconclusive","On"],["Audit trail","Unattributed actions","`platform_audit`, `integration_audit`, `runtime_events`; hash chain in file mode","On"]]}},{"title":"Evals and quality gates","table":{"cols":["Eval","What it measures","When it runs","Threshold","Status"],"rows":[["Per-step quality score","Output quality heuristic (0–10)","Every live LLM step; averaged per run","Shown on the step","Live"],["Output contract","Required sections, citations, handoff fields","Every step","Missing → retry once, then inconclusive","Live"],["Evaluation datasets","Labelled pass/fail per case, with reasons","Recorded by operators (`/api/evaluations`)","1–100 cases per dataset","Live"],["Registry release gate","Readiness to activate a skill package","On review","≥3 live cases, 100% pass, reviewer ≠ publisher","Live"],["Workflow certification","Execution readiness per definition","`GET /api/certification`","Vendor sandbox: not yet certified","Partial"],["Catalogue certification (M5)","All 81 definitions complete simulated with outputs","CI (M2 runner)","100%","Live in CI"],["Review pipeline","Multi-role review verdicts","On request","Approve / changes requested","Live; results not stored"],["Agent KPIs, after-action reports","Agent performance over time","After runs","—","File mode only; on PostgreSQL planned (G13)"],["Test suites","Correctness: 427 Vitest unit and contract tests, Postgres acceptance M0 (2 suites) and M2 (20 sections) (M3–M7 contracts), browser sign-in","Every pull request","All must pass","Live; blocking"],["CI gates","Audit (high), typecheck, lint, compose config, build, tests, Postgres acceptance, browser auth, gateway smoke (ready ≤60 s, clean SIGTERM)","Every push and pull request","All blocking","Live"]]}},{"title":"Tech stack","table":{"cols":["Layer","Components"],"rows":[["Web","Next.js 15.5 · React 18.3 · Tailwind CSS 3.4 · Zustand 4.5 · shadcn/ui on Radix (overhaul, U0)"],["Gateway","Node.js ≥22.20 · TypeScript 5 · plain `node:http` · zod 4 · ioredis 5 · MCP SDK 1.31"],["Runtime and data","PostgreSQL 16 with pgvector (row-level security, migrations 007–026) · `pg` 8 · file store fallback"],["AI","Anthropic Claude (Opus 4.7, Sonnet 4.6, Haiku 4.5) · OpenAI gpt-4o / mini · Azure OpenAI · Google Gemini · Ollama"],["Identity and secrets","API keys (HMAC) · HS256 sessions · OIDC (PKCE) · HashiCorp Vault KV2"],["Observability","OpenTelemetry SDK 0.220 (OTLP HTTP) · structured logs · optional Grafana in the production compose"],["Build and test","pnpm 10.14 · Turborepo 2 · Vitest 1.6 · Playwright 1.58 · tsx"],["Delivery","Docker (`node:22-alpine`) · Docker Compose (dev Postgres; production stack with migrate, app-role, Redis) · GitHub Actions CI · Vercel (web); gateway container host planned (P5)"]]}},{"title":"Switches","table":{"cols":["Env variable","Effect","Default"],"rows":[["`DATABASE_URL`","Durable runtime and platform on PostgreSQL; without it, file mode","Unset (file mode)"],["`EAOS_DEMO_MODE`","`local`: no sign-in on this machine · `public`: private, always-simulated visitor sessions","`off` (`pnpm dev` sets `local`)"],["`ANTHROPIC_API_KEY` · `OPENAI_API_KEY` · `GEMINI_API_KEY` · `AZURE_OPENAI_*` · `OLLAMA_BASE_URL`","Which providers are available; none → labelled simulation","Unset"],["`JWT_SECRET` · `EAOS_SETUP_TOKEN`","Signing; first-run setup","Required in production"],["`VAULT_ADDR` · `VAULT_TOKEN`","Connector secret resolution","Unset"],["`OIDC_ISSUER_URL` · `OIDC_CLIENT_ID` · …","Organisation single sign-on","Unset"],["`REDIS_URL`","Multi-instance WebSocket fan-out","Unset"],["`CORS_ALLOWED_ORIGINS` · `EAOS_TRUSTED_PROXIES`","Browser origins; trusted proxy for client IPs","Unset (fail closed in production)"],["`OTEL_EXPORTER_OTLP_ENDPOINT`","Tracing export","Unset"],["`VOICEBOX_URL` · `CODE_MEMORY_BIN` · `SKILLSPECTOR_CMD`","Optional MCP servers","Unset"],["`ALLOW_ANON` · `ALLOW_DEV_API_KEYS` · `SEED_DEMO`","Development conveniences","Off; refused in production"]]}}]}</script>

<script>
(function () {
  const W = JSON.parse(document.getElementById('workflow-data').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // Inline `code` and **bold** in body text, after escaping.
  const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  if (location.hash === '#diagram' || new URLSearchParams(location.search).has('diagram')) document.body.classList.add('diagram-only');

  document.title = W.title;
  document.getElementById('title').textContent = W.title;
  document.getElementById('subtitle').textContent = W.subtitle || '';
  document.getElementById('meta').innerHTML = (W.meta || []).map(m => `<dt>${esc(m.k)}</dt><dd>${rich(m.v)}</dd>`).join('');

  const KIND_LABEL = {
    actor: 'People and UI', service: 'Service code (deterministic)', llm: 'LLM call', embedding: 'Embedding call',
    api: 'Platform / integration API', platform: 'Platform or data service', optional: 'Optional (config switch)',
    notintegrated: 'Not integrated yet', guardrail: 'Guardrail', eval: 'Eval / quality check',
  };
  const phases = W.phases, lanes = W.lanes;
  const colW = p => p.gap ? '46px' : `${p.width || 236}px`;
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.style.gridTemplateColumns = `150px ${phases.map(colW).join(' ')}`;

  // Row 1: use-case bands spanning their phases.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  let col = 2;
  const ucOf = id => (W.useCases || []).find(u => u.phases.includes(id));
  for (let i = 0; i < phases.length;) {
    const uc = ucOf(phases[i].id);
    if (!uc) { grid.insertAdjacentHTML('beforeend', `<div style="grid-column:${col}"></div>`); i++; col++; continue; }
    let span = 0; while (i + span < phases.length && ucOf(phases[i + span].id) === uc) span++;
    grid.insertAdjacentHTML('beforeend', `<div class="uc" style="grid-column:${col} / span ${span}">${esc(uc.id)}&nbsp; ${esc(uc.title)}</div>`);
    i += span; col += span;
  }
  // Row 2: phase headers.
  grid.insertAdjacentHTML('beforeend', '<div></div>');
  phases.forEach(p => grid.insertAdjacentHTML('beforeend', p.gap ? '<div></div>' : `<div class="ph">${esc(p.title)}</div>`));
  // Lane rows.
  lanes.forEach((lane, li) => {
    grid.insertAdjacentHTML('beforeend', `<div class="lanehead"><b>${esc(lane.title)}</b><span>${esc(lane.subtitle || '')}</span></div>`);
    phases.forEach(p => {
      if (p.gap) {
        if (li === 0) grid.insertAdjacentHTML('beforeend', `<div class="gapcol" style="grid-row: span ${lanes.length}"><span>${esc(p.text || '')}</span></div>`);
        return;
      }
      const boxes = (W.boxes || []).filter(b => b.phase === p.id && b.lane === lane.id);
      grid.insertAdjacentHTML('beforeend', `<div class="cell">${boxes.map(b => `
        <div class="box k-${esc(b.kind)}">
          ${b.badge ? `<div class="badge">${esc(b.badge)}</div>` : ''}
          <div class="tag">${esc(b.tag || KIND_LABEL[b.kind] || '')}</div>
          <div class="t">${esc(b.title)}</div>
          <div class="b">${rich(b.body || '')}</div>
        </div>`).join('')}</div>`);
    });
  });
  const used = [...new Set((W.boxes || []).map(b => b.kind))];
  const legend = `<div class="legend"><b style="color:var(--ink)">Legend</b>${used.map(k => `<span><i class="k-${k}"></i>${esc(KIND_LABEL[k] || k)}</span>`).join('')}<span><i class="n"></i>Step in the walkthrough</span></div>`;
  const foot = `<div class="foot"><span>${rich(W.footnote || '')}</span><span>${rich(W.source || '')}</span></div>`;
  const d = document.getElementById('diagram');
  d.appendChild(grid);
  d.insertAdjacentHTML('beforeend', legend + foot);

  // Readout text: step walkthrough, then tables / bullet sections.
  const t = [];
  if (W.steps) {
    t.push(`<h2>The flow, step by step</h2><p class="intro">Numbers match the badges in the diagram.</p>`);
    W.steps.forEach(g => {
      t.push(`<h3>${esc(g.group)}</h3><ol class="steps">${g.items.map(s => `<li><span class="num">${esc(s.n ?? '·')}</span><span>${rich(s.text)}</span></li>`).join('')}</ol>`);
    });
  }
  (W.sections || []).forEach(s => {
    t.push(`<h2>${esc(s.title)}</h2>`);
    if (s.intro) t.push(`<p class="intro">${rich(s.intro)}</p>`);
    if (s.table) t.push(`<table><thead><tr>${s.table.cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${s.table.rows.map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`);
    if (s.bullets) t.push(`<ul class="bul">${s.bullets.map(b => `<li>${rich(b)}</li>`).join('')}</ul>`);
  });
  document.getElementById('text').innerHTML = t.join('');
})();
</script>
</body>
