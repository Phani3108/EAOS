# ============================================================
# AgentOS — Production Docker Compose
# Enterprise Agent Operating System
#
# Usage:
#   cp deploy/.env.example deploy/.env  # Fill in secrets
#   docker compose -f deploy/docker-compose.production.yml up -d
#
# @author Phani Marupaka
# @copyright © 2026 Phani Marupaka. All rights reserved.
# ============================================================

version: '3.9'

services:
  # ── Gateway API Server ────────────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ['node', 'packages/db/dist/migrate.js']
    environment:
      - DATABASE_URL=${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL for the migration owner}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: gateway
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      # LLM Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Database
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL for a non-owner application role}
      - REDIS_URL=redis://redis:6379
      - SEED_DEMO=false
      # Auth
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - EAOS_SETUP_TOKEN=${EAOS_SETUP_TOKEN:-}
      - EAOS_TENANT_ID=${EAOS_TENANT_ID:-default}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3010}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3010}
      - GATEWAY_URL=${GATEWAY_URL:-http://localhost:3010/_/gateway}
      - API_KEY_HASH_SECRET=${API_KEY_HASH_SECRET:-}
      - VAULT_ADDR=${VAULT_ADDR:-}
      - VAULT_TOKEN=${VAULT_TOKEN:-}
      - VAULT_KV_MOUNT=${VAULT_KV_MOUNT:-secret}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_DEFAULT_TENANT=${EAOS_TENANT_ID:-default}
      # Cost Controls
      - COST_BUDGET_HOURLY_USD=${COST_BUDGET_HOURLY_USD:-50}
      # Connectors
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      # Observability
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # ── Web Frontend ──────────────────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: web
    ports:
      - '3010:3010'
    environment:
      - NODE_ENV=production
      - GATEWAY_INTERNAL_URL=http://gateway:3000
    depends_on:
      - gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ── PostgreSQL + pgvector ─────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=eaos
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-eaos-dev-password}
      - POSTGRES_DB=eaos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eaos']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── NATS (Event Bus) ──────────────────────────────────────────
  nats:
    image: nats:2-alpine
    ports:
      - '4222:4222'
      - '8222:8222'  # Monitoring
    command: ['--jetstream', '--store_dir=/data']
    volumes:
      - natsdata:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

  # ── OpenTelemetry Collector ───────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    ports:
      - '4317:4317'   # gRPC
      - '4318:4318'   # HTTP
      - '8889:8889'   # Prometheus metrics
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Grafana (Dashboards) ──────────────────────────────────────
  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - '3001:3000'
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - otel-collector
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  natsdata:
  grafanadata:

networks:
  default:
    name: agentos
